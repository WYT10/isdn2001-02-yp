name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s test/web -v
      - run: python tools/run_host_tests.py
      - run: python tools/deploy_pythonanywhere.py bundle
      - run: python tools/check_project.py
      - uses: actions/upload-artifact@v4
        with:
          name: pythonanywhere-starter
          path: dist/pythonanywhere-starter.zip
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [seeed_xiao_esp32s3, esp32_wroom, esp32s3_devkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e ${{ matrix.environment }}
