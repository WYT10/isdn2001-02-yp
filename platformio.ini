; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_devkit

[env]
platform = espressif32@7.0.1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -Wall -Wextra
extra_scripts = pre:tools/pio_prepare.py

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3

[env:esp32s3_devkit]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3_devkit"
build_flags = ${env.build_flags} -DFLOW_BOARD_S3_DEVKIT=1
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0

[env:selftest]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DFLOW_RUN_SELF_TEST=1

[env:esp32_wroom]
board = esp32dev
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0

[env:esp32_wroom_selftest]
extends = env:esp32_wroom
build_flags = ${env.build_flags} -DFLOW_RUN_SELF_TEST=1
